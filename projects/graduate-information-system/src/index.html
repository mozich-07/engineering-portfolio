<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集演示 - 毕业生就业信息管理系统</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Microsoft YaHei",sans-serif;
    }
    :root{
        --main-color:#1a53b5;
        --main-light:#3474d9;
        --success-color:#2d9c64;
        --warn-color:#dd6b20;
        --danger-color:#e53e3e;
        --bg-gradient:linear-gradient(135deg,#77acf1 0%,#d6e7ff 100%);
        --card-bg:#ffffff;
        --text-gray:#666;
        --border-color:#e2e8f0;
    }
    body{
        background: var(--bg-gradient);
        background-attachment: fixed;
        padding:30px 20px;
        min-height:100vh;
    }
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-thumb{background:#b3c8e8;border-radius:3px;}
    ::-webkit-scrollbar-track{background:#f1f5fa;}

    .container{
        max-width:1700px;
        margin:0 auto;
        background:var(--card-bg);
        border-radius:20px;
        box-shadow:0 10px 40px rgba(26,83,181,0.15);
        padding:35px;
        overflow:hidden;
        transition: all 0.3s ease;
    }
    .title{
        text-align:center;
        color:var(--main-color);
        font-size:26px;
        margin-bottom:12px;
        font-weight:700;
        letter-spacing:1px;
    }
    .subtitle{
        text-align:center;
        color:var(--text-gray);
        font-size:15px;
        margin-bottom:35px;
    }
    .card{
        background:#f8fafe;
        border-radius:16px;
        padding:28px;
        margin-bottom:25px;
        border:1px solid var(--border-color);
        transition:0.3s;
    }
    .card:hover{
        box-shadow:0 6px 20px rgba(26,83,181,0.08);
    }
    .form-group{
        margin:16px 0;
        display:flex;
        align-items:center;
        flex-wrap:wrap;
    }
    .form-group label{
        width:140px;
        color:#333;
        font-weight:500;
        font-size:15px;
    }
    input,select,textarea{
        padding:11px 15px;
        border:1px solid var(--border-color);
        border-radius:12px;
        width:280px;
        outline:none;
        font-size:14px;
        transition:0.3s;
        background:#fff;
    }
    textarea{
        height:75px;
        resize:none;
    }
    input:focus,select:focus,textarea:focus{
        border-color:var(--main-color);
        box-shadow:0 0 0 3px rgba(26,83,181,0.15);
    }
    .btn{
        padding:11px 22px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        font-size:14px;
        margin-right:10px;
        transition:all 0.25s ease;
        font-weight:500;
    }
    .btn:active{transform:scale(0.96);}
    .btn-blue{
        background:var(--main-color);
        color:white;
    }
    .btn-blue:hover{ background:var(--main-light); box-shadow:0 4px 12px rgba(26,83,181,0.3); }
    .btn-green{
        background:var(--success-color);
        color:white;
    }
    .btn-green:hover{ box-shadow:0 4px 12px rgba(45,156,100,0.3); }
    .btn-red{
        background:var(--danger-color);
        color:white;
    }
    .btn-red:hover{ box-shadow:0 4px 12px rgba(229,62,62,0.3); }
    .btn-orange{
        background:var(--warn-color);
        color:white;
    }
    .btn-orange:hover{ box-shadow:0 4px 12px rgba(221,107,32,0.3); }
    .alert{
        color:var(--danger-color);
        margin:12px 0;
        text-align:center;
        font-weight:500;
        font-size:14px;
    }
    .success{
        color:var(--success-color);
        margin:12px 0;
        text-align:center;
        font-weight:500;
        font-size:14px;
    }
    table{
        width:100%;
        border-collapse:collapse;
        background:white;
        border-radius:16px;
        overflow:hidden;
        margin-top:15px;
    }
    th{
        background:var(--main-color);
        color:white;
        padding:13px 8px;
        text-align:center;
        font-size:14px;
        font-weight:500;
        cursor:pointer;
        user-select:none;
        transition:0.2s;
    }
    th:hover{
        background:var(--main-light);
    }
    th .sort-arrow{
        margin-left:5px;
        opacity:0.5;
    }
    th .sort-arrow.active{
        opacity:1;
        font-weight:bold;
    }
    td{
        padding:12px 8px;
        text-align:center;
        font-size:13.5px;
        word-break:break-all;
        border-bottom:1px solid #f0f4f9;
        transition:0.2s;
    }
    tbody tr:nth-child(even){background:#f8fafe;}
    tbody tr:hover{background:#eef4fc;}
    .filter-bar{
        display:flex;
        flex-wrap:wrap;
        gap:12px;
        margin-bottom:18px;
        align-items:center;
    }
    .filter-bar input,.filter-bar select{
        width:180px;
    }
    .title-bar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:25px;
    }
    .user-info{
        color:var(--main-color);
        font-weight:600;
        font-size:15px;
    }
    .hide{
        display: none !important;
    }
    .import-log{
        background:#f8f9fa;
        padding:15px;
        border-radius:12px;
        margin-top:15px;
        max-height:300px;
        overflow-y:auto;
        font-size:13px;
        white-space:pre-line;
        text-align:left;
        line-height:1.5;
    }
    .table-wrapper{
        overflow-x:auto;
        margin-top:15px;
    }
    #loginPage{
        max-width:520px;
        margin:60px auto 0;
    }
    h3{
        color:var(--main-color);
        font-size:18px;
        margin-bottom:10px;
    }
    input[type="checkbox"]{
        width:18px;
        height:18px;
        cursor:pointer;
        accent-color:var(--main-color);
    }
    @media (max-width:768px){
        .form-group{flex-direction:column;align-items:flex-start;}
        .form-group label{width:100%;margin-bottom:6px;}
        input,select,textarea{width:100%;}
        .container{padding:20px;}
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
<div class="container" id="loginPage">
    <div class="title">作品集演示</div>
    <div class="subtitle">毕业生就业信息管理系统</div>
    <div class="card">
        <div class="form-group">
            <label>登录账号：</label>
            <input id="uid" placeholder="管理员：000000">
        </div>
        <div class="form-group">
            <label>登录密码：</label>
            <input id="pwd" type="password" placeholder="默认密码：123">
        </div>
        <div style="margin-top:25px;text-align:center;">
            <button class="btn btn-blue" onclick="login()">立即登录系统</button>
        </div>
        <div id="loginMsg" class="alert"></div>
    </div>
</div>

<div class="container" id="mainPage" style="display:none;">
    <div class="title">作品集演示</div>
    <div class="subtitle">毕业生就业信息管理中心</div>
    <div class="title-bar">
        <div class="user-info" id="userInfo"></div>
        <button class="btn btn-red" onclick="logout()">退出登录</button>
    </div>

    <button class="btn btn-blue" onclick="showAdd()">信息录入</button>
    <button class="btn btn-green" onclick="showList()">信息列表</button>
    <button id="batchBtn" class="btn btn-orange" onclick="showBatch()">批量导入导出</button>

    <div id="addPanel" class="card" style="display:none;margin-top:20px;">
        <h3>就业信息填写</h3>
        <div class="form-group"><label>学号：</label><input id="sid"></div>
        <div class="form-group"><label>姓名：</label><input id="name"></div>
        <div class="form-group"><label>所属系部：</label><select id="dept" onchange="updateMajor()"></select></div>
        <div class="form-group"><label>所学专业：</label><select id="major"></select></div>
        <div class="form-group"><label>所在班级：</label><input id="cls"></div>
        <div class="form-group"><label>性别：</label><select id="gender"><option>男</option><option>女</option></select></div>
        <div class="form-group"><label>联系电话：</label><input id="phone"></div>

        <div class="form-group">
            <label>毕业发展方向：</label>
            <select id="status" onchange="switchMain()">
                <option value="">请选择发展方向</option>
                <option value="study">升学深造</option>
                <option value="job">直接就业</option>
                <option value="other">其他规划</option>
            </select>
        </div>

        <div id="studyBox" class="hide">
            <div class="form-group"><label>出国（境）直接填写国家：</label><input id="abroad"></div>
            <div class="form-group">
                <label>是否过线准备复试？：</label>
                <select id="studyRes">
                    <option value="">请选择</option>
                    <option>是</option>
                    <option>否，准备找工作</option>
                    <option>否，准备二战</option>
                </select>
            </div>
        </div>

        <div id="jobBox" class="hide">
            <div class="form-group">
                <label>就业意向类型：</label>
                <select id="jobMain" onchange="switchJob()">
                    <option value="">请选择</option>
                    <option>公务员省考</option>
                    <option>事业单位编制</option>
                    <option>市场型企业就业</option>
                    <option>自主创业</option>
                    <option>灵活就业</option>
                    <option>参军入伍</option>
                </select>
            </div>
            <div id="jobSecKa" class="hide">
                <div class="form-group">
                    <label>省考是否进面？：</label>
                    <select id="kaResult">
                        <option>是</option>
                        <option>否，准备找工作</option>
                        <option>否，继续备考</option>
                    </select>
                </div>
            </div>
            <div id="jobSecMarket" class="hide">
                <div class="form-group">
                    <label>求职进度：</label>
                    <select id="marketResult">
                        <option>已初步落实</option>
                        <option>已有目标</option>
                        <option>暂未有目标</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="otherBox" class="hide">
            <div class="form-group"><label>其他规划说明：</label><input id="otherInfo"></div>
        </div>

        <div class="form-group">
            <label>个人诉求与困难：</label>
            <textarea id="desc" placeholder="可填写求职困难、就业需求、帮扶建议等"></textarea>
        </div>

        <button class="btn btn-blue" onclick="saveInfo()">提交保存信息</button>
        <div id="addTip" class="alert"></div>
    </div>

    <div id="listPanel" style="display:none;margin-top:20px;">
        <div class="filter-bar">
            <input id="f_sid" placeholder="输入学号筛选">
            <input id="f_name" placeholder="输入姓名筛选">
            <select id="f_dept">
                <option value="">全部系部</option>
            </select>
            <input id="f_cls" placeholder="输入班级筛选">
            <input id="f_major" placeholder="输入专业筛选">
            <button class="btn btn-green" onclick="loadList()">筛选查询</button>
            <button class="btn" style="background:#f1f5fa;color:#333;" onclick="clearFilter()">清空筛选</button>
            <button class="btn btn-red" onclick="batchDelete()">批量删除选中</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll" onclick="toggleCheckAll()"></th>
                        <th onclick="sortTable('sid')">学号 <span class="sort-arrow" id="sort-sid">↑↓</span></th>
                        <th onclick="sortTable('name')">姓名 <span class="sort-arrow" id="sort-name">↑↓</span></th>
                        <th onclick="sortTable('dept')">系部 <span class="sort-arrow" id="sort-dept">↑↓</span></th>
                        <th onclick="sortTable('major')">专业 <span class="sort-arrow" id="sort-major">↑↓</span></th>
                        <th onclick="sortTable('cls')">班级 <span class="sort-arrow" id="sort-cls">↑↓</span></th>
                        <th onclick="sortTable('gender')">性别 <span class="sort-arrow" id="sort-gender">↑↓</span></th>
                        <th onclick="sortTable('phone')">电话 <span class="sort-arrow" id="sort-phone">↑↓</span></th>
                        <th onclick="sortTable('status')">发展方向 <span class="sort-arrow" id="sort-status">↑↓</span></th>
                        <th>详细状态</th>
                        <th>其他规划</th>
                        <th>个人诉求</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <div id="batchPanel" class="card" style="display:none;margin-top:20px;">
        <h3>批量数据管理（支持筛选后导出）</h3>
        <div class="form-group">
            <input type="file" id="fileImport" accept=".xlsx">
            <button class="btn btn-blue" onclick="doImport()">Excel批量导入</button>
            <button class="btn btn-green" onclick="doExportExcel()">导出Excel表格</button>
            <button class="btn btn-orange" onclick="doExportPDF()">导出PDF报表</button>
        </div>
        <div id="batchTip" class="alert"></div>
        <div id="batchSuccess" class="success"></div>
        <div id="importLog" class="import-log hide"></div>
    </div>
</div>

<script>
const deptMajorMap={
    "化工与医药系":["高分子材料与工程","给排水科学与工程","护理学","化学工程与工艺","环境工程","生物制药","制药工程"],
    "机械电子工程系":["电子信息工程","机械设计制造及其自动化","计算机科学与技术","软件工程","通信工程","微电子科学与工程","智能制造工程"],
    "经济管理系":["财务管理","国际经济与贸易","会计学","市场营销"],
    "旅游与艺术系":["服装与服饰","环境设计","旅游管理","视觉传达设计","园林"],
    "土木电气工程系":["电气工程及其自动化","工程管理","水利水电工程","土木工程","新能源科学与工程"],
    "文法系":["法学","广播电视学","汉语言文学","日语","社会工作","英语"]
};

let role="",uid="",data=[],currentFilterList=[];
let sortField="sid",sortAsc=true;

window.onload=function(){
    let local=localStorage.getItem("portfolio.grad.demo.v1");
    if(local)data=JSON.parse(local);
    initDept();
    initFilterDept();
};
function escapeCell(value) {
    const elem = document.createElement("span");
    elem.textContent = String(value ?? "");
    return elem.innerHTML.replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}
function saveLocal(){localStorage.setItem("portfolio.grad.demo.v1",JSON.stringify(data));}

// 初始化添加页系部
function initDept(){
    let d=document.getElementById("dept");
    d.innerHTML="<option value=''>请选择所属系部</option>";
    for(let k in deptMajorMap)d.innerHTML+=`<option>${k}</option>`;
}
// 初始化筛选下拉系部
function initFilterDept(){
    let fdept = document.getElementById("f_dept");
    for(let k in deptMajorMap){
        fdept.innerHTML += `<option value="${k}">${k}</option>`;
    }
}
function updateMajor(){
    let d=document.getElementById("dept").value;
    let m=document.getElementById("major");
    m.innerHTML="<option value=''>请选择对应专业</option>";
    if(deptMajorMap[d])deptMajorMap[d].forEach(x=>m.innerHTML+=`<option>${x}</option>`);
}

function switchMain(){
    let s=document.getElementById("status").value;
    document.getElementById("studyBox").classList.add("hide");
    document.getElementById("jobBox").classList.add("hide");
    document.getElementById("otherBox").classList.add("hide");
    document.getElementById("jobSecKa").classList.add("hide");
    document.getElementById("jobSecMarket").classList.add("hide");
    if(s=="study")document.getElementById("studyBox").classList.remove("hide");
    if(s=="job")document.getElementById("jobBox").classList.remove("hide");
    if(s=="other")document.getElementById("otherBox").classList.remove("hide");
}
function switchJob(){
    let m=document.getElementById("jobMain").value;
    document.getElementById("jobSecKa").classList.add("hide");
    document.getElementById("jobSecMarket").classList.add("hide");
    if(m=="公务员省考")document.getElementById("jobSecKa").classList.remove("hide");
    if(m=="市场型企业就业")document.getElementById("jobSecMarket").classList.remove("hide");
}

function login(){
    let u=document.getElementById("uid").value.trim();
    let p=document.getElementById("pwd").value.trim();
    if(u=="000000"&&p=="123"){role="admin";uid=u;goMain();}
    else if(u.length==9&&p==u){role="student";uid=u;goMain();}
    else document.getElementById("loginMsg").innerText="账号或密码输入错误，请重新填写";
}
function goMain(){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainPage").style.display="block";
    document.getElementById("userInfo").innerText=role=="admin"?"作品集演示｜管理员":"学生："+uid;
    if(role=="student")document.getElementById("batchBtn").style.display="none";
    showList();
}
function logout(){location.reload();}

function showAdd(){document.getElementById("addPanel").style.display="block";document.getElementById("listPanel").style.display="none";document.getElementById("batchPanel").style.display="none";}
function showList(){document.getElementById("addPanel").style.display="none";document.getElementById("listPanel").style.display="block";document.getElementById("batchPanel").style.display="none";loadList();}
function showBatch(){document.getElementById("addPanel").style.display="none";document.getElementById("listPanel").style.display="none";document.getElementById("batchPanel").style.display="block";}

function saveInfo(){
    let item = {
        sid:document.getElementById("sid").value.trim(),
        name:document.getElementById("name").value.trim(),
        dept:document.getElementById("dept").value,
        major:document.getElementById("major").value,
        cls:document.getElementById("cls").value.trim(),
        gender:document.getElementById("gender").value,
        phone:document.getElementById("phone").value.trim(),
        status:document.getElementById("status").value,
        abroad:document.getElementById("abroad").value.trim(),
        studyRes:document.getElementById("studyRes").value,
        jobMain:document.getElementById("jobMain").value,
        kaResult:document.getElementById("kaResult").value,
        marketResult:document.getElementById("marketResult").value,
        otherInfo:document.getElementById("otherInfo").value.trim(),
        desc:document.getElementById("desc").value.trim()
    };
    if(role=="student"&&item.sid!=uid){document.getElementById("addTip").innerText="学生仅可填写本人信息";return;}
    if(!item.sid||!item.name||!item.dept||!item.major||!item.status){document.getElementById("addTip").innerText="必填项不能为空";return;}
    let idx=data.findIndex(x=>x.sid==item.sid);
    idx>-1?data[idx]=item:data.push(item);
    saveLocal();
    document.getElementById("addTip").innerText="保存成功";
    clearAddForm();
}
function clearAddForm(){
    document.querySelectorAll("#addPanel input,#addPanel select,#addPanel textarea").forEach(i=>i.value="");
    switchMain();initDept();
}

function sortTable(field){
    if(sortField === field){ sortAsc = !sortAsc; } else { sortField = field; sortAsc = true; }
    document.querySelectorAll(".sort-arrow").forEach(arrow=>{ arrow.classList.remove("active"); });
    document.getElementById(`sort-${field}`).classList.add("active");
    loadList();
}

function toggleCheckAll(){
    let checkAll = document.getElementById("checkAll");
    document.querySelectorAll(".row-check").forEach(box=>{ box.checked = checkAll.checked; });
}

function batchDelete(){
    if(role!=="admin")return;
    let list = document.querySelectorAll(".row-check:checked");
    if(list.length===0){alert("请选择数据");return;}
    if(!confirm("确定删除？"))return;
    let sids = Array.from(list).map(i=>i.value);
    data = data.filter(x=>!sids.includes(x.sid));
    saveLocal();
    loadList();
    document.getElementById("checkAll").checked=false;
}

function loadList(){
    let fs=document.getElementById("f_sid").value.trim();
    let fn=document.getElementById("f_name").value.trim();
    let fd=document.getElementById("f_dept").value;
    let fcls=document.getElementById("f_cls").value.trim();
    let fm=document.getElementById("f_major").value.trim();

    let list=[...data];
    if(role=="student")list=list.filter(x=>x.sid==uid);
    if(fs)list=list.filter(x=>x.sid.includes(fs));
    if(fn)list=list.filter(x=>x.name.includes(fn));
    if(fd)list=list.filter(x=>x.dept===fd);
    if(fcls)list=list.filter(x=>x.cls.includes(fcls));
    if(fm)list=list.filter(x=>x.major.includes(fm));

    list.sort((a,b)=>{
        let v1=a[sortField]||""; let v2=b[sortField]||"";
        if(sortField==="status"){v1=(v1=="study"?"升学深造":v1=="job"?"直接就业":"其他规划");v2=(v2=="study"?"升学深造":v2=="job"?"直接就业":"其他规划");}
        return sortAsc ? String(v1).localeCompare(String(v2)) : String(v2).localeCompare(String(v1));
    });

    currentFilterList=list;
    let tb=document.getElementById("dataTable");tb.innerHTML="";
    list.forEach(x=>{
        let st=x.status=="study"?"升学深造":x.status=="job"?"直接就业":"其他规划";
        let d="";
        if(x.status=="study")d=(x.abroad||"")+" "+(x.studyRes||"");
        if(x.status=="job")d=(x.jobMain||"")+" "+(x.kaResult||x.marketResult||"");

        tb.innerHTML+=`<tr>
            <td><input type="checkbox" class="row-check" value="${escapeCell(x.sid)}"></td>
            <td>${escapeCell(x.sid)}</td><td>${escapeCell(x.name)}</td><td>${escapeCell(x.dept)}</td><td>${escapeCell(x.major)}</td><td>${escapeCell(x.cls||"-")}</td><td>${escapeCell(x.gender)}</td><td>${escapeCell(x.phone||"-")}</td>
            <td>${escapeCell(st)}</td><td>${escapeCell(d||"-")}</td><td>${escapeCell(x.otherInfo||"-")}</td><td>${escapeCell(x.desc||"-")}</td>
            <td>${role=="admin"?`<button class='btn btn-blue' style='padding:6px 10px;font-size:12px;' data-sid="${escapeCell(x.sid)}" onclick="edit(this.dataset.sid)">修改</button><button class='btn btn-red' style='padding:6px 10px;font-size:12px;' data-sid="${escapeCell(x.sid)}" onclick="del(this.dataset.sid)">删除</button>`:"无权限"}
        </tr>`;
    });
}

function clearFilter(){
    document.getElementById("f_sid").value="";
    document.getElementById("f_name").value="";
    document.getElementById("f_dept").value="";
    document.getElementById("f_cls").value="";
    document.getElementById("f_major").value="";
    sortField="sid"; sortAsc=true;
    document.querySelectorAll(".sort-arrow").forEach(a=>a.classList.remove("active"));
    loadList();
}

function edit(sid){
    let d=data.find(x=>x.sid==sid);if(!d)return;
    document.getElementById("sid").value=d.sid;
    document.getElementById("name").value=d.name;
    document.getElementById("dept").value=d.dept;
    updateMajor();
    document.getElementById("major").value=d.major;
    document.getElementById("cls").value=d.cls;
    document.getElementById("gender").value=d.gender;
    document.getElementById("phone").value=d.phone;
    document.getElementById("status").value=d.status;
    switchMain();
    document.getElementById("abroad").value=d.abroad||"";
    document.getElementById("studyRes").value=d.studyRes||"";
    document.getElementById("jobMain").value=d.jobMain||"";
    document.getElementById("kaResult").value=d.kaResult||"";
    document.getElementById("marketResult").value=d.marketResult||"";
    document.getElementById("otherInfo").value=d.otherInfo||"";
    document.getElementById("desc").value=d.desc||"";
    showAdd();
}

function del(sid){
    if(!confirm("确定删除？"))return;
    data=data.filter(x=>x.sid!=sid);
    saveLocal(); loadList();
}

function doExportExcel(){
    if(role!=="admin")return;
    let list=currentFilterList.length?currentFilterList:data;
    if(!list.length){alert("无数据");return;}
    let h=[["学号","姓名","系部","专业","班级","性别","电话","毕业状态","留学国家","考研状态","就业类型","省考结果","求职情况","其他说明","个人诉求"]];
    let r=list.map(i=>{
        let t="",sa="",ss="",jt="",kr="",mr="",o="";
        if(i.status=="study"){t="升学深造";sa=i.abroad||"";ss=i.studyRes||"";}
        else if(i.status=="job"){t="直接就业";jt=i.jobMain||"";kr=i.kaResult||"";mr=i.marketResult||"";}
        else{t="其他规划";o=i.otherInfo||"";}
        return [i.sid,i.name,i.dept,i.major,i.cls,i.gender,i.phone,t,sa,ss,jt,kr,mr,o,i.desc||""];
    });
    let ws=XLSX.utils.aoa_to_sheet([...h,...r]);
    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"就业信息");
    XLSX.writeFile(wb,"作品集演示_就业信息表.xlsx");
}

function doExportPDF() {
    if (role !== "admin") return;
    let list = currentFilterList.length > 0 ? currentFilterList : data;
    if (list.length <= 0) { alert("暂无数据可导出"); return; }

    let tableHtml = `<table border="1" cellpadding="5" cellspacing="0" style="font-size:12px;width:100%">
        <tr style="background:#1a53b5;color:#fff;">
            <th>学号</th><th>姓名</th><th>系部</th><th>专业</th><th>班级</th><th>性别</th><th>电话</th>
            <th>毕业状态</th><th>留学国家</th><th>考研状态</th><th>就业类型</th><th>省考结果</th><th>求职情况</th><th>其他说明</th><th>个人诉求</th>
        </tr>`;

    list.forEach(item => {
        let statusTxt = "";
        let studyAbroad = "", studyState = "";
        let jobType = "", kaRes = "", marketRes = "";
        let other = "";

        if(item.status == "study"){
            statusTxt = "升学深造";
            studyAbroad = item.abroad || "";
            studyState = item.studyRes || "";
        } else if(item.status == "job"){
            statusTxt = "直接就业";
            jobType = item.jobMain || "";
            kaRes = item.kaResult || "";
            marketRes = item.marketResult || "";
        } else {
            statusTxt = "其他规划";
            other = item.otherInfo || "";
        }

        tableHtml += `<tr>
            <td>${escapeCell(item.sid||"")}</td><td>${escapeCell(item.name||"")}</td><td>${escapeCell(item.dept||"")}</td><td>${escapeCell(item.major||"")}</td>
            <td>${escapeCell(item.cls||"")}</td><td>${escapeCell(item.gender||"")}</td><td>${escapeCell(item.phone||"")}</td>
            <td>${escapeCell(statusTxt)}</td>
            <td>${escapeCell(studyAbroad)}</td><td>${escapeCell(studyState)}</td>
            <td>${escapeCell(jobType)}</td><td>${escapeCell(kaRes)}</td><td>${escapeCell(marketRes)}</td>
            <td>${escapeCell(other)}</td><td>${escapeCell(item.desc||"")}</td>
        </tr>`;
    });

    tableHtml += `</table>`;
    let tempBox = document.createElement("div");
    tempBox.style.position = "absolute";
    tempBox.style.left = "-9999px";
    tempBox.style.width = "1400px";
    tempBox.innerHTML = tableHtml;
    document.body.appendChild(tempBox);

    html2canvas(tempBox,{scale:2}).then(canvas=>{
        const {jsPDF} = jspdf;
        let pdf = new jsPDF("landscape","px",[canvas.width,canvas.height]);
        pdf.addImage(canvas,"JPEG",0,0,canvas.width,canvas.height);
        pdf.save("作品集演示_就业信息表.pdf");
        document.body.removeChild(tempBox);
    })
}

function doImport(){
    if(role!=="admin")return;
    let f=document.getElementById("fileImport").files[0];
    if(!f){alert("请选择文件");return;}
    let log=document.getElementById("importLog");
    let suc=document.getElementById("batchSuccess");
    let tip=document.getElementById("batchTip");
    log.classList.remove("hide");
    suc.innerText="";tip.innerText="";
    log.innerText="正在校验并导入数据...\n";

    let reader=new FileReader();
    reader.onload=e=>{
        let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        let json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        let ok=0,dup=0,err=0;let msg="";

        json.forEach((row,idx)=>{
            let line=idx+2;
            let sid=String(row["学号"]||"").trim();
            let name=String(row["姓名"]||"").trim();
            let dept=String(row["系部"]||"").trim();
            let major=String(row["专业"]||"").trim();
            let phone=String(row["电话"]||"").trim();
            let state=String(row["毕业状态"]||"").trim();

            if(!sid){msg+=`第${line}行：学号为空\n`;err++;return;}
            if(sid.length!==9||isNaN(sid)){msg+=`第${line}行：学号必须是9位数字 → ${sid}\n`;err++;return;}
            if(!name){msg+=`第${line}行：姓名为空\n`;err++;return;}
            if(!dept){msg+=`第${line}行：系部为空\n`;err++;return;}
            if(!major){msg+=`第${line}行：专业为空\n`;err++;return;}
            if(!state){msg+=`第${line}行：毕业状态为空\n`;err++;return;}
            if(phone && (phone.length!==11 || isNaN(phone))){msg+=`第${line}行：手机号必须是11位数字 → ${phone}\n`;err++;return;}
            if(data.some(x=>x.sid===sid)){msg+=`第${line}行：学号${sid}已存在\n`;dup++;return;}

            let stv=state==="升学深造"?"study":state==="直接就业"?"job":"other";
            data.push({
                sid,name,dept,major,cls:row["班级"]||"",
                gender:row["性别"]||"",phone,status:stv,
                abroad:row["留学国家"]||"",studyRes:row["考研状态"]||"",
                jobMain:row["就业类型"]||"",kaResult:row["省考结果"]||"",
                marketResult:row["求职情况"]||"",otherInfo:row["其他说明"]||"",desc:row["个人诉求"]||""
            });
            ok++;
        });

        saveLocal();loadList();
        log.innerText=msg||"全部校验通过！";
        tip.innerText="";
        suc.innerText=`导入完成：成功 ${ok} 条 | 重复 ${dup} 条 | 错误 ${err} 条`;
        document.getElementById("fileImport").value="";
    };
    reader.readAsArrayBuffer(f);
}
</script>
